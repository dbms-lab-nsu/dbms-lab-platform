[project]
name = "tests"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["api"]
addopts = "--strict-markers -m 'not perfomance'"
markers = [
    "perfomance: concurrency and performance tests, excluded by default",
    "jwt: JWT security tests against the API",
    "jwt_signing: tests requiring the test backend JWT_KEY and --run-jwt-signing",
]
