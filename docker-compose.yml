services:
  postgres:
    image: postgres:18.6-alpine
    container_name: dbms-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbms_lab}
      POSTGRES_USER: ${POSTGRES_USER:-dbms_lab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbms_lab_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbms_lab_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbms_lab_user} -d ${POSTGRES_DB:-dbms_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: ./backend/DBMSLab.Api
      dockerfile: Dockerfile
      target: migrations
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=dbms_lab;Username=dbms_lab_user;Password=dbms_lab_password}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend/DBMSLab.Api
      dockerfile: Dockerfile
    container_name: dbms-lab-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=dbms_lab;Username=dbms_lab_user;Password=dbms_lab_password}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dbms-lab-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  dbms_lab_postgres_data:
